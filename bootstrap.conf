# bootstrap-linux.sh 配置文件
#
# 说明：
#   这个文件会被 bootstrap-linux.sh 以 shell source 的方式读取，因此请保持
#   “变量名=值”的格式，不要在等号两侧加空格。
#
# 使用方式：
#   ./bootstrap-linux.sh
#   ./bootstrap-linux.sh --config ./bootstrap.conf
#
# 注意：
#   不要使用 sudo ./bootstrap-linux.sh。
#   普通用户运行时，脚本只会对系统级命令自动使用 sudo。
#   root 用户可以直接运行，配置会安装到 /root。
#
# 安全默认：
#   如果脚本找不到默认配置文件，会自动按 PROFILE=minimal 运行。

# PROFILE 控制安装层级。
#   minimal  - 只执行基础安装：基础工具、oh-my-zsh、远程 myconfig、dotfiles、Vundle、tpm。
#   advanced - 先执行 minimal，再根据下面 INSTALL_* 开关安装高级组件。
PROFILE=advanced

# 远程 dotfiles 仓库地址。
# 默认值为 https://github.com/Liameternal/myconfig.git。
# 如需换成自己的 fork，可以取消下一行注释并修改 URL。
# REPO_URL=https://github.com/Liameternal/myconfig.git

# 远程 dotfiles 仓库在本机的目标目录。
# 默认值为目标用户家目录下的 myconfig，即 $TARGET_HOME/myconfig。
# 普通用户运行时通常是 /home/your-user/myconfig；root 直接运行时是 /root/myconfig。
# DEST_DIR=/home/your-user/myconfig

# advanced 组件开关。
#   true  - 安装该组件。
#   false - 跳过该组件。
#
# 注意：
#   这些开关只在 PROFILE=advanced 时生效。
#   PROFILE=advanced 且某个 INSTALL_* 没有写在配置文件中时，该组件默认 true。
#   PROFILE=minimal 时，高级组件全部跳过。
INSTALL_CONDA=true
INSTALL_DOCKER=true
INSTALL_KUBECTL=true
INSTALL_KIND=true
INSTALL_OVS=true

# Miniconda 下载地址。
# 通常不需要修改；只有在内网镜像或固定版本时才需要启用。
# MINICONDA_URL=https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
